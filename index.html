<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamari Batein</title><style>body{margin:0;background:#fff;color:#172033;font-family:Inter,system-ui,Arial;min-height:100vh;display:grid;place-items:center}.card{width:min(390px,calc(100% - 32px));padding:28px;border:1px solid #e4e7ec;border-radius:22px;box-shadow:0 12px 40px #17203312}.brand{font-size:28px;font-weight:900;margin-bottom:8px}.sub{color:#70798a;line-height:1.5;margin-bottom:22px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe3e9;border-radius:12px;margin:7px 0;font-size:16px;outline:none}input:focus{border-color:#6572ff;box-shadow:0 0 0 3px #eef0ff}button{width:100%;padding:14px;border:0;border-radius:12px;background:#5b6cff;color:#fff;font-weight:800;font-size:15px;margin-top:10px;cursor:pointer}button:disabled{opacity:.6}.hint{font-size:12px;color:#7c8594;margin-top:10px}.err{color:#d43d51;font-size:13px;margin-top:10px;line-height:1.45}</style></head><body><main class="card"><div class="brand">💬 Hamari Batein</div><div class="sub">Apni unique ID banao aur private 1-to-1 baatein shuru karo.</div><input id="displayName" maxlength="30" placeholder="Your name"><input id="username" maxlength="20" autocomplete="username" placeholder="Unique ID — e.g. yashu_07"><button id="startBtn" type="button">Create / Enter</button><div class="hint">ID: 3–20 lowercase letters, numbers and underscore.</div><div id="authErr" class="err"></div></main><script type="module">
const V='12.19.0';
const cfg={apiKey:'AIzaSyAXC1BImpHxvn8tI3pXwqNHZGh-LFTsjn8',authDomain:'yashuterainstablock.firebaseapp.com',databaseURL:'https://yashuterainstablock-default-rtdb.firebaseio.com',projectId:'yashuterainstablock',storageBucket:'yashuterainstablock.firebasestorage.app',messagingSenderId:'279541635211',appId:'1:279541635211:web:a1d7df87b6638571cedc8e'};
const $=id=>document.getElementById(id), clean=x=>x.trim().toLowerCase(), valid=x=>/^[a-z0-9_]{3,20}$/.test(x);
let auth,db,ref,get,set;
async function init(){
  const [A,B,C]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`)
  ]);
  const app=A.initializeApp(cfg); auth=B.getAuth(app); db=C.getDatabase(app); ref=C.ref; get=C.get; set=C.set;
  try{await B.setPersistence(auth,B.browserLocalPersistence)}catch(e){console.warn('persistence',e)}
}
function errorText(e){return (e?.code?e.code+': ':'')+(e?.message||String(e));}
async function start(){
  const name=$('displayName').value.trim(), username=clean($('username').value); const b=$('startBtn');
  $('authErr').textContent='';
  if(!name)return $('authErr').textContent='Enter your name.';
  if(!valid(username))return $('authErr').textContent='ID must be 3–20 characters: a-z, 0-9, _. ';
  b.disabled=true; b.textContent='Connecting…';
  try{
    if(!auth) await init();
    let user=auth.currentUser;
    if(!user) user=(await BSignIn()).user;
    const uid=user.uid;
    const uref=ref(db,'users/'+username);
    const snap=await get(uref);
    if(snap.exists() && snap.val().uid!==uid) throw new Error('This username is already registered. Choose another one.');
    const map=await get(ref(db,'uidToUsername/'+uid));
    if(map.exists() && map.val()!==username) throw new Error('This browser is already linked to @'+map.val()+'.');
    await set(uref,{uid,name,username,createdAt:snap.exists()?snap.val().createdAt:Date.now()});
    await set(ref(db,'uidToUsername/'+uid),username);
    sessionStorage.setItem('hb_ready','1');
    location.replace('chat.html');
  }catch(e){console.error(e);$('authErr').textContent=errorText(e);b.disabled=false;b.textContent='Create / Enter';}
}
let signInAnonymouslyFn;
async function BSignIn(){ if(!signInAnonymouslyFn){const M=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);signInAnonymouslyFn=M.signInAnonymously;} return signInAnonymouslyFn(auth); }
$('startBtn').addEventListener('click',start);
$('username').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
$('displayName').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
init().catch(e=>{$('authErr').textContent='Firebase setup failed: '+errorText(e);});
</script></body></html>
