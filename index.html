<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamari Batein</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#172033}button,input{font:inherit}.app{width:min(1180px,100%);height:100%;margin:auto;background:#fff;display:grid;grid-template-columns:330px 1fr;overflow:hidden}.sidebar{border-right:1px solid #e5e9ef;display:flex;flex-direction:column;background:#fff}.top{padding:20px;border-bottom:1px solid #edf0f4}.brand{font-size:22px;font-weight:900;letter-spacing:-.6px;color:#172033}.brand span{color:#5b6cff}.me{font-size:13px;color:#7a8495;margin-top:5px}.search{margin:14px 16px 9px;padding:12px 14px;border:1px solid #e1e6ed;border-radius:12px;width:calc(100% - 32px);outline:0;background:#f7f8fa;color:#172033}.search:focus,.composer input:focus,.card input:focus,.authcard input:focus{border-color:#aeb7ff;box-shadow:0 0 0 3px #eef0ff}.add{margin:0 16px 12px;width:calc(100% - 32px);padding:12px;border:0;border-radius:12px;background:#5b6cff;color:#fff;font-weight:800;cursor:pointer}.chats{overflow:auto;flex:1}.chatitem{padding:14px 17px;border-bottom:1px solid #f0f2f5;cursor:pointer}.chatitem:hover{background:#f7f8fb}.chatname{font-weight:800}.preview{font-size:13px;color:#8993a3;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{display:flex;flex-direction:column;min-width:0;background:#fafbfc}.empty{margin:auto;text-align:center;color:#8a94a4;padding:30px}.empty h2{color:#172033}.chatview{height:100%;display:none;flex-direction:column}.chathead{padding:12px 18px;border-bottom:1px solid #e7ebf0;display:flex;align-items:center;gap:12px;background:#fff}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#eef0ff;color:#4c59d8;font-weight:900}.headname{font-weight:900}.online{font-size:12px;color:#7f8998;margin-top:3px}.headactions{margin-left:auto;display:flex;gap:8px}.iconbtn{width:44px;height:44px;border:1px solid #e1e6ed;background:#fff;color:#25304a;border-radius:12px;cursor:pointer}.iconbtn:hover{background:#f5f6f8}.messages{flex:1;overflow:auto;padding:20px;background:#f8fafc;display:flex;flex-direction:column;gap:8px}.bubble{max-width:72%;padding:10px 13px;border-radius:16px;line-height:1.35;word-break:break-word;box-shadow:0 1px 2px #1720330d}.mine{align-self:flex-end;background:#5b6cff;color:#fff;border-bottom-right-radius:5px}.theirs{align-self:flex-start;background:#fff;border:1px solid #e4e8ee;border-bottom-left-radius:5px}.tm{font-size:10px;opacity:.65;text-align:right;margin-top:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e7ebf0;background:#fff}.composer input{flex:1;padding:13px 15px;border:1px solid #dfe4eb;border-radius:23px;outline:0;background:#f8f9fb;color:#172033}.composer button{padding:0 20px;border:0;border-radius:23px;background:#5b6cff;color:#fff;font-weight:800;cursor:pointer}.modal,.auth,.callmodal{position:fixed;inset:0;background:#17203355;display:none;place-items:center;padding:20px;z-index:30}.auth{background:#f4f6f8;display:grid}.card,.authcard{background:#fff;border:1px solid #e1e6ed;width:min(430px,100%);padding:25px;border-radius:20px;box-shadow:0 18px 55px #1720331c}.card h2,.authcard h1{margin-top:0}.card input,.authcard input{width:100%;padding:13px;margin:7px 0;border:1px solid #dfe4eb;border-radius:11px;outline:0;background:#fff;color:#172033}.card button,.authcard button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:11px;background:#5b6cff;color:#fff;font-weight:800;cursor:pointer}.cancel{background:#eef0f4!important;color:#25304a!important}.err{color:#d64052;font-size:13px;margin-top:8px}.hint{font-size:12px;color:#7f8998;margin-top:8px;line-height:1.5}.mobileback{display:none;border:0;background:transparent;color:#172033;font-size:22px}.incoming{width:min(360px,100%);text-align:center;background:#fff;border:1px solid #e1e6ed;border-radius:22px;padding:26px;box-shadow:0 20px 60px #17203325}.incoming .avatar{margin:0 auto 12px;width:70px;height:70px;font-size:25px}.incoming h2{margin:8px 0 4px}.incoming p{color:#7f8998}.callactions{display:flex;gap:10px;margin-top:20px}.callactions button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.accept{background:#20b875;color:#fff}.reject,.end{background:#ef5b68;color:#fff}.callpanel{position:fixed;right:22px;bottom:22px;width:min(360px,calc(100% - 44px));background:#fff;border:1px solid #e1e6ed;border-radius:20px;padding:18px;z-index:40;box-shadow:0 18px 60px #17203325;display:none}.calltop{display:flex;align-items:center;gap:12px}.calltop .avatar{width:48px;height:48px}.callname{font-weight:900}.callstate{font-size:12px;color:#7f8998;margin-top:3px}.callbuttons{display:flex;justify-content:center;gap:12px;margin-top:18px}.round{width:48px;height:48px;border:1px solid #e1e6ed;border-radius:50%;background:#f5f6f8;color:#25304a;cursor:pointer}.round.end{background:#ef5b68;color:#fff;border:0}.muted{background:#fff0c7!important;color:#6b4e00!important}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.app.mobile-chat .sidebar{display:none}.app.mobile-chat .main{display:flex}.mobileback{display:block}}
</style></head><body>
<div id="auth" class="auth"><div class="authcard"><h1>💬 Hamari Batein</h1><p>Apni unique ID banao aur private 1-to-1 baatein shuru karo.</p><input id="displayName" maxlength="30" placeholder="Your name"><input id="username" maxlength="20" autocomplete="username" placeholder="Unique ID — e.g. yashu_07"><button id="startBtn">Create / Enter</button><div class="hint">ID: 3–20 lowercase letters, numbers and underscore.</div><div id="authErr" class="err"></div></div></div>
<div id="app" class="app" style="display:none"><aside class="sidebar"><div class="top"><div class="brand">Hamari<span> Batein</span></div><div class="me" id="myId"></div></div><input class="search" id="search" placeholder="Unique ID search karo..."><button class="add" id="addBtn">＋ New Chat</button><div class="chats" id="chatList"></div></aside><main class="main"><div id="empty" class="empty"><h2>Hamari baatein</h2><p>Kisi ki unique ID search karke private baat shuru karo.</p></div><div id="chatView" class="chatview"><div class="chathead"><button class="mobileback" id="backBtn">←</button><div class="avatar" id="chatAvatar">?</div><div><div class="headname" id="chatName"></div><div class="online" id="chatStatus">Private chat</div></div><div class="headactions"><button class="iconbtn" id="callBtn" title="Audio call">📞</button></div></div><div class="messages" id="messages"></div><div class="composer"><input id="msg" maxlength="2000" placeholder="Message..."><button id="send">Send</button></div></div></main></div>
<div class="modal" id="modal"><div class="card"><h2>Nayi baat</h2><input id="findId" maxlength="20" placeholder="Enter unique ID"><button id="findBtn">Find User</button><div id="findResult"></div><button class="cancel" id="closeBtn">Cancel</button></div></div>
<div class="callmodal" id="incomingModal"><div class="incoming"><div class="avatar" id="incomingAvatar">?</div><h2 id="incomingName">Incoming call</h2><p id="incomingId">Audio call</p><div class="callactions"><button class="reject" id="rejectBtn">Decline</button><button class="accept" id="acceptBtn">Accept</button></div></div></div>
<div class="callpanel" id="callPanel"><div class="calltop"><div class="avatar" id="callAvatar">?</div><div><div class="callname" id="callName">Audio call</div><div class="callstate" id="callState">Connecting…</div></div></div><div class="callbuttons"><button class="round" id="muteBtn" title="Mute">🎙️</button><button class="round end" id="endCallBtn" title="End call">☎</button></div><audio id="remoteAudio" autoplay></audio></div>
<script type="module">
const firebaseVersion="12.19.0";
const [firebaseAppMod,firebaseAuthMod,firebaseDbMod]=await Promise.all([
  import(`https://www.gstatic.com/firebasejs/${firebaseVersion}/firebase-app.js`),
  import(`https://www.gstatic.com/firebasejs/${firebaseVersion}/firebase-auth.js`),
  import(`https://www.gstatic.com/firebasejs/${firebaseVersion}/firebase-database.js`)
]);
const {initializeApp}=firebaseAppMod;
const {getAuth,signInAnonymously}=firebaseAuthMod;
const {getDatabase,ref,set,get,push,onValue,serverTimestamp,remove}=firebaseDbMod;
const firebaseConfig={apiKey:"AIzaSyAXcB1ImpHxvn8tI3pXwqNHZGh-LFTsjn8",authDomain:"yashuterainstablock.firebaseapp.com",databaseURL:"https://yashuterainstablock-default-rtdb.firebaseio.com",projectId:"yashuterainstablock",storageBucket:"yashuterainstablock.firebasestorage.app",messagingSenderId:"279541635211",appId:"1:279541635211:web:a1d7df87b6638571cedc8e"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let uid=null,myUsername="",myName="",activeUser=null,stopMessages=null,stopIncoming=null,currentCall=null,pc=null,localStream=null,callRole=null;
const $=id=>document.getElementById(id),cleanId=x=>x.trim().toLowerCase(),validId=x=>/^[a-z0-9_]{3,20}$/.test(x),chatId=(a,b)=>[a,b].sort().join("__"),initials=n=>(n||"?").trim().slice(0,1).toUpperCase();
async function ensureAuth(){
  if(auth.currentUser){uid=auth.currentUser.uid;return uid;}
  try{
    const cred=await Promise.race([signInAnonymously(auth),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Firebase sign-in timed out. Check that Anonymous Authentication is enabled and refresh.")),12000))]);
    uid=cred.user.uid;
    return uid;
  }catch(e){
    const code=e?.code||"unknown";
    const msg=e?.message||String(e);
    throw new Error(code+": "+msg);
  }
}
async function start(){
  const name=$('displayName').value.trim(),username=cleanId($('username').value);
  $('authErr').textContent="";
  if(!name)return $('authErr').textContent="Enter your name.";
  if(!validId(username))return $('authErr').textContent="Invalid ID. Use 3–20 lowercase letters, numbers or underscore.";
  const btn=$('startBtn');
  btn.disabled=true;btn.textContent='Connecting…';
  try{
    if(!auth || !db) throw new Error("Firebase did not initialize. Refresh the page and try again.");
    await ensureAuth();
    const uref=ref(db,"users/"+username),snap=await get(uref);
    if(snap.exists()){
      if(snap.val()?.uid!==uid) throw new Error("This ID is already registered. You cannot login using someone else’s name/username.");
    }
    const old=await get(ref(db,"uidToUsername/"+uid));
    if(old.exists()&&old.val()!==username)throw new Error("This browser is already linked to @"+old.val()+".");
    await set(uref,{uid,name,username,createdAt:snap.exists()?snap.val().createdAt:serverTimestamp()});
    await set(ref(db,"uidToUsername/"+uid),username);
    myUsername=username;myName=name;
    $('auth').style.display="none";$('app').style.display="grid";$('myId').textContent="@"+username;loadChats();listenIncoming();
  }catch(e){
    console.error(e);
    $('authErr').textContent="Error: "+(e?.message||e);
  }finally{$('startBtn').disabled=false;$('startBtn').textContent='Create / Enter';}
}

$('startBtn').onclick=start;$('username').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('addBtn').onclick=()=>{$('modal').style.display='grid';$('findId').focus()};$('closeBtn').onclick=()=>{$('modal').style.display='none';$('findResult').innerHTML=''};
$('findBtn').onclick=async()=>{const id=cleanId($('findId').value);$('findResult').textContent='';if(!validId(id))return $('findResult').innerHTML='<div class="err">Enter a valid ID.</div>';if(id===myUsername)return $('findResult').innerHTML='<div class="err">That is your own ID.</div>';try{const snap=await get(ref(db,"users/"+id));if(!snap.exists())return $('findResult').innerHTML='<div class="err">User not found.</div>';const u=snap.val(),b=document.createElement('button');b.textContent='Chat with @'+u.username;b.onclick=async()=>{await createChat(u.username,u.name);$('modal').style.display='none';openChat(u.username,u.name)};$('findResult').appendChild(b)}catch(e){$('findResult').innerHTML='<div class="err">Search failed.</div>'}};
async function createChat(username,name){const id=chatId(myUsername,username);const existing=await get(ref(db,'chats/'+id));if(!existing.exists()){const members={};members[myUsername]=true;members[username]=true;const profiles={};profiles[myUsername]={username:myUsername,name:myName};profiles[username]={username,name};await set(ref(db,'chats/'+id),{members,profiles,updatedAt:serverTimestamp()})}await set(ref(db,'chatIndex/'+myUsername+'/'+username),{chatId:id,name});await set(ref(db,'chatIndex/'+username+'/'+myUsername),{chatId:id,name:myName})}
function loadChats(){onValue(ref(db,"chatIndex/"+myUsername),snap=>{$('chatList').innerHTML='';Object.entries(snap.val()||{}).forEach(([username,info])=>{const item=document.createElement('div');item.className='chatitem';item.innerHTML='<div class="chatname">@'+username+'</div><div class="preview">'+(info.name||'Private chat')+'</div>';item.onclick=()=>openChat(username,info.name);$('chatList').appendChild(item)})})}
function openChat(username,name){activeUser=username;$('empty').style.display='none';$('chatView').style.display='flex';$('app').classList.add('mobile-chat');$('chatName').textContent='@'+username+' • '+name;$('chatAvatar').textContent=initials(name);$('chatStatus').textContent='Private chat';$('messages').innerHTML='';if(stopMessages)stopMessages();const id=chatId(myUsername,username);stopMessages=onValue(ref(db,'messages/'+id),snap=>{$('messages').innerHTML='';Object.values(snap.val()||{}).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{const b=document.createElement('div');b.className='bubble '+(m.uid===uid?'mine':'theirs');const t=document.createElement('div');t.textContent=m.text;const tm=document.createElement('div');tm.className='tm';if(m.timestamp)tm.textContent=new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});b.append(t,tm);$('messages').appendChild(b)});$('messages').scrollTop=$('messages').scrollHeight})}
async function send(){const text=$('msg').value.trim();if(!text||!activeUser)return;const id=chatId(myUsername,activeUser);await set(push(ref(db,'messages/'+id)),{uid,text,timestamp:serverTimestamp()});await set(ref(db,'chats/'+id+'/updatedAt'),serverTimestamp());$('msg').value='';$('msg').focus()}$('send').onclick=send;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('backBtn').onclick=()=>{$('app').classList.remove('mobile-chat');$('chatView').style.display='none';$('empty').style.display='block';activeUser=null;if(stopMessages)stopMessages()};$('search').addEventListener('input',e=>{const q=cleanId(e.target.value);[...$('chatList').children].forEach(x=>x.style.display=(!q||x.textContent.toLowerCase().includes(q))?'block':'none')});
async function createPeer(callId,role){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate)set(push(ref(db,'calls/'+callId+'/'+(role==='caller'?'callerCandidates':'calleeCandidates')),e.candidate.toJSON())};pc.ontrack=e=>{$('remoteAudio').srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(['connected'].includes(pc.connectionState))$('callState').textContent='Connected';if(['failed','disconnected'].includes(pc.connectionState))$('callState').textContent='Connection lost'};if(role==='caller'){localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream))}return pc}
async function startCall(){if(!activeUser)return;if(!navigator.mediaDevices?.getUserMedia)return alert('Microphone/WebRTC is not supported in this browser.');try{const us=await get(ref(db,'users/'+activeUser));if(!us.exists())return alert('User not found.');const target=us.val();const callRef=push(ref(db,'calls'));const callId=callRef.key;callRole='caller';currentCall={id:callId,otherUid:target.uid,otherUsername:activeUser,otherName:target.name};pc=await createPeer(callId,'caller');const offer=await pc.createOffer();await pc.setLocalDescription(offer);await set(callRef,{callerUid:uid,callerUsername:myUsername,callerName:myName,calleeUid:target.uid,calleeUsername:activeUser,calleeName:target.name,status:'ringing',offer:{type:offer.type,sdp:offer.sdp},createdAt:serverTimestamp()});await set(ref(db,'incomingCalls/'+target.uid+'/'+callId),true);$('callAvatar').textContent=initials(target.name);$('callName').textContent='@'+activeUser;$('callState').textContent='Calling…';$('callPanel').style.display='block';onValue(ref(db,'calls/'+callId+'/answer'),async s=>{if(s.exists()&&pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(new RTCSessionDescription(s.val()))});onValue(ref(db,'calls/'+callId+'/calleeCandidates'),s=>s.forEach(c=>pc?.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{})))}catch(e){alert('Could not start call: '+e.message);cleanupCall()}}
function listenIncoming(){if(stopIncoming)stopIncoming();stopIncoming=onValue(ref(db,'incomingCalls/'+uid),snap=>{Object.keys(snap.val()||{}).slice(0,1).forEach(async id=>{const s=await get(ref(db,'calls/'+id));if(!s.exists()||s.val().status!=='ringing')return;const c=s.val();currentCall={id,otherUid:c.callerUid,otherUsername:c.callerUsername,otherName:c.callerName};$('incomingAvatar').textContent=initials(c.callerName);$('incomingName').textContent=c.callerName;$('incomingId').textContent='@'+c.callerUsername+' is calling you';$('incomingModal').style.display='grid'})})}
$('acceptBtn').onclick=async()=>{if(!currentCall)return;try{const id=currentCall.id,s=(await get(ref(db,'calls/'+id))).val();callRole='callee';$('incomingModal').style.display='none';pc=await createPeer(id,'callee');localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(new RTCSessionDescription(s.offer));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await set(ref(db,'calls/'+id+'/answer'),{type:ans.type,sdp:ans.sdp});await set(ref(db,'calls/'+id+'/status'),'accepted');$('callAvatar').textContent=initials(currentCall.otherName);$('callName').textContent='@'+currentCall.otherUsername;$('callState').textContent='Connecting…';$('callPanel').style.display='block';onValue(ref(db,'calls/'+id+'/callerCandidates'),snap=>snap.forEach(c=>pc?.addIceCandidate(new RTCIceCandidate(c.val())).catch(()=>{})))}catch(e){alert('Could not accept call: '+e.message);cleanupCall()}};
$('rejectBtn').onclick=async()=>{if(currentCall)await set(ref(db,'calls/'+currentCall.id+'/status'),'rejected');$('incomingModal').style.display='none';currentCall=null};$('callBtn').onclick=startCall;$('endCallBtn').onclick=async()=>{if(currentCall)await set(ref(db,'calls/'+currentCall.id+'/status'),'ended');cleanupCall()};$('muteBtn').onclick=()=>{if(!localStream)return;const t=localStream.getAudioTracks()[0];t.enabled=!t.enabled;$('muteBtn').classList.toggle('muted',!t.enabled);$('muteBtn').textContent=t.enabled?'🎙️':'🔇'};
async function cleanupCall(){if(localStream)localStream.getTracks().forEach(t=>t.stop());localStream=null;if(pc){pc.close();pc=null}if(currentCall?.id){try{await remove(ref(db,'incomingCalls/'+uid+'/'+currentCall.id))}catch{}}currentCall=null;$('callPanel').style.display='none';$('incomingModal').style.display='none';$('remoteAudio').srcObject=null;$('muteBtn').classList.remove('muted');$('muteBtn').textContent='🎙️'}
</script></body></html>
